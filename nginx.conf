server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        text/x-json
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        application/javascript;

    # Add headers to force latest IE rendering engine or ChromeFrame
    add_header X-UA-Compatible "IE=Edge,chrome=1";

    # Add caching headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "Public, Public";
    }

    # Add caching headers for HTML files
    location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "private, must-revalidate";
    }
}