name: montager
description: AI Video Editor Agent - Automatically creates complete videos from user's existing raw footage using multimodal AI.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State management
  riverpod: ^2.3.6
  flutter_riverpod: ^2.3.6
  # Dependency injection
  get_it: ^7.6.0
  injectable: ^2.4.0
  # Secure storage for API keys (Keystore/Keychain)
  flutter_secure_storage: ^9.0.0
  # Data persistence
  # Using version compatible with newer sqlite3
  drift: ^2.12.0
  # sqlite3_flutter_libs only for mobile/desktop - not compatible with web
  # Using compatible version for Dart 3.x
  sqlite3_flutter_libs:
    hosted: https://pub.dev
    version: ^0.5.12
  path_provider: ^2.0.11
  path: ^1.8.3
  # Async handling
  async: ^2.10.0
  # Logging
  logger: ^1.4.0
  # For file picking
  file_picker: ^11.0.0
  # For video player preview
  video_player: ^2.6.0
  # For sharing
  share_plus: ^7.0.2
  # For path handling on Android
  path_provider_android: ^2.0.23
  # For path handling on iOS
  path_provider_ios: ^2.0.11
  # For JSON handling
  json_annotation: ^4.8.1
  # For equatable (value-based equality)
  equatable: ^2.0.5
  # HTTP client for AI provider API calls
  http: ^1.2.2
  # Annotations such as @protected
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  # Code generation for drift
  drift_dev: ^2.12.0
  build_runner: ^2.4.6
  # JSON serialization
  json_serializable: ^6.7.1
  # Testing
  mocktail: ^0.3.0
  test: ^1.24.0

# Override sqlite3_flutter_libs to prevent FFI usage in web builds
# The actual web compatibility is handled in video_database.dart via kIsWeb check
dependency_overrides:
  sqlite3_flutter_libs: ^0.5.12

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/